  summary: >-
    Computer Science student focusing on systems programming and network infrastructure.
    Have gained practical understanding by contributing to DPU-accelerated service mesh
    research and building a custom x86-64 compiler. Motivated by the challenge of solving
    low-level hardware-software bottlenecks and further expanding my knowledge in
    distributed systems.

