    Experience:
      - company: TNET Lab, Seoul National University
        position: Research Intern
        location: Seoul, Republic of Korea
        start_date: 2025-12
        end_date: present
        summary: >-
          DPUmesh — a service mesh that offloads sidecar proxying onto a NVIDIA BlueField-3 DPU,
          so that microservice communication stops competing with the application for host CPU.
        highlights:
          - Researching and optimizing service mesh architectures on Data Processing Units to reduce host CPU overhead.
          - Integrated the DPUmesh architecture directly into the Apache Thrift RPC framework, so existing services adopt the offloaded data path with zero modifications to user code.
          - Benchmarked sidecar proxy overhead with DeathStarBench, exercising realistic multi-hop microservice call graphs.
          - Diagnosed and resolved severe Consul service-registry leaks that were stalling CPU and exhausting connections under sustained load.

    Projects:
      - name: SNUPL/2 Compiler
        summary: >-
          A complete compiler for SNUPL/2, a small imperative language, written from scratch in C —
          no lex, no yacc, no LLVM.
        start_date: 2023-09
        end_date: 2023-12
        highlights:
          - Built the full pipeline: hand-written lexer, recursive-descent parser, AST construction, and semantic analysis with scope and type checking.
          - Implemented the backend to emit x86-64 assembly directly, handling register allocation and stack frame layout by hand.

      - name: MomenTag
        summary: >-
          A tag-based photo management application organized around tags rather than folders,
          built full-stack from scratch.
        start_date: 2025-09
        end_date: 2025-12
        highlights:
          - Designed and implemented a RESTful backend in Django, covering the data model, authentication, and tag query endpoints.
          - Built a native Android client in Kotlin with Jetpack Compose against that API.

