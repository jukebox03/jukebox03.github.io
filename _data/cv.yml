        icon: fa-solid fa-code
        keywords: "C/C++, Python, Java, OCaml, Go, SQL"
      - name: Systems & Networking
        icon: fa-solid fa-network-wired
        keywords: "Linux System Programming, k8s, Service Mesh (Istio, Envoy, Linkerd), DPU (BlueField-3), DMA"
      - name: Tools & Frameworks
        icon: fa-solid fa-screwdriver-wrench
        keywords: "DOCA, Git, Qiskit, Django, Jetpack Compose"

