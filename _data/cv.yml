      - institution: Seoul National University (SNU)
        location: Seoul, Korea
        url: https://cse.snu.ac.kr/en
        area: Computer Science and Engineering
        studyType: B.S.
        start_date: 2022-03
        end_date: 2027-08
        highlights:
          - "**GPA:** 3.95/4.30"
          - "**Relevant Coursework:** Computer Network, System Programming, Computer Architecture, Quantum Computing, Theoretical Physics"
          - "**Interests:** High-Performance Networking, System Programming"

      - institution: Seoul Science High School (SSHS)
        location: Seoul, Korea
        start_date: 2019-03
        end_date: 2022-02
        highlights:
          - "**GPA:** 4.18/4.30"

    Military Service:
      - label: Republic of Korea Army
        details: 8th Division, K21 IFV Gunner, January 2024 - July 2025

    # The template only supports flat highlights, so each CV sub-bullet is
    # merged onto its parent label. Bolding follows the CV.
    Experience:
      - company: TNET lab
        position: Research Intern
        location: Seoul, Korea
        start_date: 2025-12
        end_date: present
        summary: "DPUmesh Project"
        highlights:
          - "**DPU-Accelerated Service Mesh:** Researching and optimizing service mesh architectures using Data Processing Units (DPU) to reduce CPU overhead."
          - "Linkerd Offload: Running the Linkerd data plane directly on the BlueField-3 DPU, so sidecar proxying executes off the host CPU."
          - "Transparent Framework Integration: Integrated the DPUmesh architecture directly into the gRPC framework, enabling existing applications to leverage the new service mesh with zero modifications to user code."
          - "**Sidecar Benchmarking & System Debugging:** Benchmarked proxy overhead via DeathStarBench and resolved severe Consul registry leaks causing CPU and connection stalls."

    # A single `date` renders one year; a start/end pair in the same year renders "2023 - 2023".
    Projects:
      - name: SNUPL2 Compiler
        summary: Developer
        date: 2023
        highlights:
          - Developed a full-stack compiler for SNUPL/2, a custom educational programming language, completely from scratch using C.
          - Managed the end-to-end compilation pipeline, including lexical analysis, parsing, Abstract Syntax Tree (AST) construction, and semantic analysis.
          - Implemented the compiler backend to generate x86-64 assembly code, directly handling low-level register allocation.

      - name: MomenTag
        summary: Full-Stack Developer
        date: 2025
        highlights:
          - Built a tag-based photo management application from scratch.
          - Designed and integrated a RESTful backend using Django with a modern Android frontend using Jetpack Compose.

    Awards:
      - title: Second prize - Graduation Research Paper Presentation Contest (Physics, SSHS)
        date: 2021
      - title: Participant - 33rd Final Korean Mathematical Olympiad (FKMO)
        date: 2019

    Skills:
